name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go, Hugo, Dart Sass, htmltest, Node, markdownlint-cli2
        run: sh tools/install.sh "$RUNNER_TEMP/tools" go hugo sass htmltest node markdownlint
      - name: Build
        run: . "$RUNNER_TEMP/tools/env.sh" && hugo --panicOnWarning
      - name: Check links, images and anchors
        run: . "$RUNNER_TEMP/tools/env.sh" && htmltest
      - name: Lint the content
        run: . "$RUNNER_TEMP/tools/env.sh" && markdownlint-cli2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: public/
          if-no-files-found: error

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No gitleaks config or ignore file
        run: |
          for f in .gitleaks.toml .gitleaksignore; do
            if [ -e "$f" ]; then echo "::error file=$f::$f must not exist: it can switch off rules or findings"; exit 1; fi
          done
      - name: Install gitleaks
        run: sh tools/install.sh "$RUNNER_TEMP/tools" gitleaks
      - name: Scan all commits
        run: . "$RUNNER_TEMP/tools/env.sh" && gitleaks git --redact --no-banner --ignore-gitleaks-allow --log-opts=--all .
