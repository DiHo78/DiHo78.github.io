baseURL: https://diho78.github.io/
locale: en-us
defaultContentLanguage: en
module:
  imports:
    - path: github.com/CaiJimmy/hugo-theme-stack/v4
taxonomies:
  category: categories
  tag: tags
permalinks:
  page:
    posts: /:slug/
  term:
    categories: /category/:slug/
    tags: /tag/:slug/
outputs:
  home: [html, rss]
  section: [html, rss]
  taxonomy: [html, rss]
  term: [html, rss]
markup:
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: false
params:
  mainSections: [posts]
  rssFullContent: true
  comments:
    enabled: false
  footer:
    since: 2010
  sidebar:
    subtitle: Hin und wieder ein paar Gedanken zu SQL Server oder Azure (und manchmal auch Privates)
  widgets:
    homepage:
      - type: archives
        params: {limit: 5}
      - type: categories
        params: {limit: 10}
      - type: tag-cloud
        params: {limit: 10}
    page:
      - type: toc
