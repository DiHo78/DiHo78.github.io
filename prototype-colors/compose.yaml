# PROTOTYPE, throwaway. `docker compose up`, then open http://localhost:1316
services:
  colors:
    build: .
    image: proto-hugo:0.169.0
    command: hugo server --bind 0.0.0.0 --port 1316 --baseURL http://localhost:1316/ --disableFastRender --renderToMemory
    volumes:
      - ./site:/site
      - hugocache:/tmp/hugo_cache   # Hugo keeps the Stack module here
    ports: ["127.0.0.1:1316:1316"]
volumes:
  hugocache:
